sentence=Generic ring-buffer rolling average class with configurable size and value type.
paragraph=Template-based rolling (moving) average using a ring buffer. Buffer size and value/accumulator types are configurable per instance, so it works with uint16_t, uint32_t, int64_t, float, double, etc. Automatic rounding-drift correction for floating-point accumulators, with zero runtime cost for integer types. Includes a free-heap helper (ulFreeMemory). For ESP32.
